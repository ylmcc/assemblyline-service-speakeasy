name: Speakeasy
version: $SERVICE_TAG
description: >
  Emulates Windows PE binaries, drivers, and raw shellcode against a modeled Windows
  runtime (Unicorn CPU emulation with a faked API/filesystem/registry/network surface)
  using a vendored copy of Mandiant's Speakeasy, to observe behavior a static-only pass
  would miss: API calls, process/thread injection, dropped files, registry activity,
  and simulated network indicators. Pure emulation -- no real syscalls reach the host,
  no real network connection is made, and the submitted sample is never executed any
  other way.

accepts: executable/windows/.*
rejects: empty|metadata/.*|executable/windows/dos

stage: SECONDARY
category: Dynamic Analysis
file_required: true
timeout: 300
disable_cache: false
enabled: true
is_external: false
licence_count: 0

submission_params:
  - name: emulation_timeout_seconds
    type: int
    default: 60
    value: 60
  - name: max_emulation_memory_mb
    type: int
    default: 2048
    value: 2048
  - name: max_events_displayed
    type: int
    default: 500
    value: 500
  - name: emulate_children
    type: bool
    default: false
    value: false
  - name: extract_strings
    type: bool
    default: true
    value: true
  - name: raw_mode
    type: bool
    default: false
    value: false
  - name: raw_arch
    type: str
    default: ""
    value: ""
  - name: raw_offset_hex
    type: str
    default: ""
    value: ""
  - name: allow_self_modifying_writes
    type: bool
    default: true
    value: true

heuristics:
  - heur_id: 1
    name: Emulation completed
    description: Speakeasy successfully emulated the sample and produced a behavioral report.
    filetype: ".*"
    score: 0
  - heur_id: 2
    name: Cross-process or injection activity observed
    description: The sample allocated/wrote memory in another process, created a remote thread, or spawned a child process during emulation -- classic process injection/spawning technique.
    filetype: ".*"
    score: 400
    attack_id: T1055
  - heur_id: 3
    name: Files dropped during emulation
    description: The sample wrote one or more files during emulation; the recovered content was submitted for further static analysis.
    filetype: ".*"
    score: 100
  - heur_id: 4
    name: Emulated network activity observed
    description: The sample performed DNS/network/HTTP-shaped API calls during emulation. These are Speakeasy's own simulated responses, not real traffic, but indicate C2/beacon-shaped intent.
    filetype: ".*"
    score: 150
    attack_id: T1071
  - heur_id: 5
    name: Emulation errors encountered
    description: Speakeasy recorded session- or entry-point-level errors (e.g. an unsupported API) -- results reflect only what was successfully emulated before each error.
    filetype: ".*"
    score: 0
  - heur_id: 6
    name: Emulation incomplete or failed
    description: Speakeasy did not complete (timeout or no parseable report produced).
    filetype: ".*"
    score: 0
  - heur_id: 7
    name: Clipboard activity observed
    description: The sample read or wrote the clipboard. Speakeasy's emulated clipboard offers synthetic wallet-address-shaped text, so a sample that writes back different text is behaving like a clipboard hijacker (clipper) that swaps cryptocurrency addresses.
    filetype: ".*"
    score: 0
    signature_score_map:
      clipboard_access: 0
      clipboard_replaced: 500
    attack_id: T1115
  - heur_id: 8
    name: Anti-analysis or environment-check APIs
    description: The sample called APIs used to detect a debugger, sandbox or virtual machine (debugger checks, firmware tables, cursor position, memory size, uptime).
    filetype: ".*"
    score: 0
    signature_score_map:
      anti_debug: 100
      environment_check: 0
    attack_id: T1497
  - heur_id: 9
    name: Data decrypted during emulation
    description: The sample decrypted data through the emulated crypto API (AES via CNG). A large decrypted blob is typically an embedded payload that a crypter or loader unpacks; it is extracted for further analysis.
    filetype: ".*"
    score: 0
    signature_score_map:
      crypto_operation: 0
      payload_decrypted: 300
    attack_id: T1027

docker_config:
  image: kylemc54321/assemblyline-service-speakeasy:$SERVICE_TAG
  cpu_cores: 1
  ram_mb_min: 512
  ram_mb: 3072
  allow_internet_access: false
